<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0f0c">
<meta name="robots" content="noindex">
<title>Spade family link</title>
<link rel="icon" type="image/png" href="./icon-192.png">
<style>
  /*
    This page hands a family link to the Spade app.
    The note travels after the "#" in the address. Browsers never send that
    part to a server, so it goes from one phone to the other and nowhere else.
  */
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0d0f0c; color: #e6dfc8; }
  body {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 18px;
    padding: max(24px, env(safe-area-inset-top)) 22px max(24px, env(safe-area-inset-bottom));
    max-width: 460px;
    margin: 0 auto;
    font: 17px/1.45 Georgia, "Times New Roman", serif;
  }
  img { width: 76px; height: 76px; border-radius: 18px; }
  h1 { margin: 0; font-size: 30px; font-weight: normal; }
  p { margin: 0; color: #a3a591; }
  .button {
    display: block;
    padding: 15px 18px;
    text-align: center;
    text-decoration: none;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font: 15px/1.2 ui-monospace, Menlo, monospace;
    color: #0d0f0c;
    background: #f2b544;
    border: 0;
    width: 100%;
    clip-path: polygon(8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px), 0 8px);
  }
  .plain { background: #20241c; color: #e6dfc8; }
  .small { font-size: 14px; color: #7f8373; }
  [hidden] { display: none; }
</style>
</head>
<body>
  <img src="./icon-192.png" alt="">
  <h1 id="title">Opening Spade…</h1>
  <p id="lead">If Spade doesn't open by itself, tap the button.</p>
  <a class="button" id="open" href="#">Open in Spade</a>
  <button class="button plain" id="copy" type="button">Copy this link</button>
  <p class="small" id="help">
    Still not opening? Copy the link, then in Spade go to Settings, then Paste a family link.
    Don't have Spade yet? Ask whoever sent this for the TestFlight invite.
  </p>
  <script>
    (function () {
      var note = location.hash.slice(1);
      var open = document.getElementById('open');
      var copy = document.getElementById('copy');
      if (!note) {
        document.getElementById('title').textContent = 'This link is empty';
        document.getElementById('lead').textContent = 'Part of the link went missing on the way. Ask for it to be sent again.';
        open.hidden = true;
        copy.hidden = true;
        return;
      }
      var app = 'spade://family#' + note;
      open.href = app;
      copy.addEventListener('click', function () {
        var done = function () { copy.textContent = 'Copied'; };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(location.href).then(done, function () {});
        }
      });
      // Try straight away; the button is there if the phone wants a tap first.
      setTimeout(function () { location.href = app; }, 300);
    })();
  </script>
</body>
</html>
