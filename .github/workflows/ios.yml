# Checks the native iPhone app.
#
#   rules: runs the Swift rule tests on Linux (quick).
#   app:   builds the app on a Mac, runs it in the iPhone Simulator and saves screenshots.
#
# Signing and TestFlight uploads are not done here. Codemagic does those (see codemagic.yaml).
name: iOS

on:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Test the game rules
        run: swift test --package-path ios/Core

  app:
    runs-on: macos-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      SCREENS: launch quests hero satchel feats settings guide form dig level item picker smooth
      SMALL_SCREENS: launch quests hero dig
    steps:
      - uses: actions/checkout@v4
      - name: Show tools
        run: |
          sw_vers -productVersion
          xcodebuild -version
      - name: Build for the simulator
        run: |
          # The full log is long, so it goes to a file; only the problems are printed.
          xcodebuild -project ios/Spade.xcodeproj -scheme Spade -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || {
            grep -E ": (error|note): " build.log | sed "s|$PWD/||" | awk '!seen[$0]++' | cut -c1-500 | head -120
            echo "BUILD FAILED"
            exit 1
          }
          grep -E ": warning: " build.log | sed "s|$PWD/||" | awk '!seen[$0]++' | cut -c1-300 | head -40 || true
          echo "BUILD OK"
      - name: Run in the simulator and take screenshots
        timeout-minutes: 24
        run: bash ios/ci/screenshots.sh
      # TEMPORARY, for this pull request only: saves the screenshots on the branch so the
      # small-screen layout can be looked over. Removed again before the pull request is done.
      - name: Save screenshots on the branch
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git fetch --depth 1 origin "$BRANCH"
          git checkout -q -B shots-update FETCH_HEAD
          mkdir -p ios/ci/shots
          cp shots/*.jpg ios/ci/shots/
          git add ios/ci/shots
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Update simulator screenshots" || exit 0
          git push -q origin HEAD:"$BRANCH" || echo "The branch moved on; the next run will save its screenshots."
      # The same kind of build Codemagic makes for TestFlight, minus the signing.
      - name: Check the App Store build
        run: |
          xcodebuild -project ios/Spade.xcodeproj -scheme Spade -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath build/Spade.xcarchive CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$(date -u +%y%m%d%H%M)" archive > archive.log 2>&1 || {
            grep -E ": (error|note): " archive.log | sed "s|$PWD/||" | awk '!seen[$0]++' | cut -c1-500 | head -120
            echo "ARCHIVE FAILED"
            exit 1
          }
          APP=build/Spade.xcarchive/Products/Applications/Spade.app
          plutil -p "$APP/Info.plist" | grep -E "CFBundle(Identifier|Version|ShortVersionString|DisplayName|IconName)|UILaunchScreen|UIColorName|MinimumOSVersion|ITSApp|ttf"
          du -sh "$APP"
          echo "ARCHIVE OK"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            shots/*.png
            build.log
            archive.log
          if-no-files-found: ignore
