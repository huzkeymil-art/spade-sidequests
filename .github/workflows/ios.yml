# Checks the native iPhone app.
#
#   rules: runs the Swift rule tests on Linux (quick).
#   app:   builds the app on a Mac, runs it in the iPhone Simulator and saves screenshots.
#
# Signing and TestFlight uploads are not done here. Codemagic does those (see codemagic.yaml).
name: iOS

on:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Test the game rules
        run: swift test --package-path ios/Core

  app:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      SCREENS: launch quests hero satchel feats settings guide form dig level
      PRINT: ''
    steps:
      - uses: actions/checkout@v4
      - name: Show tools
        run: |
          sw_vers -productVersion
          xcodebuild -version
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project ios/Spade.xcodeproj -scheme Spade -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO -quiet build
      - name: Run in the simulator and take screenshots
        run: bash ios/ci/screenshots.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/*.png
          if-no-files-found: ignore
      # While the app is being built up, the latest screenshots are also saved on
      # the pull request's branch, so they can be looked at next to the code.
      - name: Save screenshots on the branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          git fetch --depth 1 origin "$BRANCH"
          git checkout -q -B shots-update FETCH_HEAD
          mkdir -p ios/ci/shots
          cp shots/*.jpg ios/ci/shots/
          git add ios/ci/shots
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Update simulator screenshots" || exit 0
          git push -q origin HEAD:"$BRANCH" || echo "The branch moved on; the next run will save its screenshots."
